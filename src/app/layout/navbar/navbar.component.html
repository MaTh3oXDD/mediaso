<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="container nav-inner">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="MediasoLogo.svg" alt="MediaSO" class="logo-img" width="127" height="28" />
    </a>

    <ul id="nav-links" class="nav-links" [class.open]="menuOpen()">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
           (click)="closeMenu()">{{ tr().nav.home }}</a>
      </li>
      <li>
        <a routerLink="/uslugi" routerLinkActive="active" (click)="closeMenu()">{{ tr().nav.services }}</a>
      </li>
      <li>
        <a routerLink="/wiedza" routerLinkActive="active" (click)="closeMenu()">{{ tr().nav.knowledge }}</a>
      </li>
      <li>
        <a routerLink="/o-nas" routerLinkActive="active" (click)="closeMenu()">{{ tr().nav.about }}</a>
      </li>
      <!-- <li>
        <a routerLink="/portfolio" routerLinkActive="active" (click)="closeMenu()">{{ tr().nav.portfolio }}</a>
      </li> -->
      <li>
        <a routerLink="/kontakt" routerLinkActive="active" (click)="closeMenu()">{{ tr().nav.contact }}</a>
      </li>
      <li>
        <a routerLink="/diagnostyka" routerLinkActive="active" (click)="closeMenu()" class="nav-assessment">
          Diagnostyka
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <a class="nav-phone" [href]="telHref" [attr.aria-label]="'Zadzwoń: ' + tr().contact.info.phone">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span class="nav-phone-number">{{ tr().contact.info.phone }}</span>
      </a>

      <button class="lang-toggle" (click)="toggleLang()" [attr.aria-label]="'Switch language'">
        <span [class.active]="currentLang() === 'pl'">PL</span>
        <span class="divider">/</span>
        <span [class.active]="currentLang() === 'en'">EN</span>
      </button>

      <button
        class="menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="nav-links"
        aria-label="Menu"
      >
        {{ menuOpen() ? 'Zamknij' : 'Menu' }}
      </button>
    </div>
  </div>
</nav>
