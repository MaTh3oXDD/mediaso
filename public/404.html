<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Nie znaleziono strony | mediaso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/MediasoLogo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000; --ink: #fff; --ink-2: rgba(255,255,255,.64); --accent: #f05e2b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 300;
      padding: 2rem; text-align: center;
    }
    .code { font-size: clamp(4rem, 14vw, 8rem); line-height: 1; color: var(--accent); margin: 0 0 1rem; }
    h1 { font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 400; margin: 0 0 .75rem; }
    p { color: var(--ink-2); margin: 0 0 2rem; max-width: 34rem; }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-block; padding: .85rem 1.75rem; text-decoration: none;
      border: 1px solid rgba(255,255,255,.2); color: var(--ink); font-size: .9rem;
      transition: border-color .2s ease, background .2s ease;
    }
    a.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Tej strony nie ma pod tym adresem</h1>
    <p>Mogła zmienić adres albo została usunięta. Wróć na stronę główną lub napisz do nas na kontakt@mediaso.pl.</p>
    <div class="links">
      <a class="primary" href="/">Strona główna</a>
      <a href="/kontakt">Kontakt</a>
    </div>
  </main>
</body>
</html>
