# mediaso.pl - nginx
#
# Kolejnosc wdrozenia:
#   1. W DNS musza istniec rekordy A dla `mediaso.pl` i `www.mediaso.pl`
#      wskazujace na 54.38.204.179. Wiszacy rekord AAAA bez rekordu A
#      sprawia, ze host timeoutuje - usun go albo dodaj dzialajacy IPv6.
#   2. Certyfikat: sudo certbot --nginx -d mediaso.pl -d www.mediaso.pl
#      Certbot moze dopisac wlasne bloki - po jego przejsciu przywroc ten plik,
#      on juz zawiera komplet dyrektyw HTTPS.
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Przekierowania trzyma nginx, nie .htaccess. Plik .htaccess z buildu jest tu
# martwy (Apache go czyta, nginx nie) i zostaje wylacznie na wypadek przenosin
# na hosting wspoldzielony.

# --- HTTP: wszystko na HTTPS na apeksie --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mediaso.pl www.mediaso.pl;

    # Certbot potrzebuje tej sciezki po HTTP przy odnowieniu certyfikatu.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://mediaso.pl$request_uri;
    }
}

# --- HTTPS www: jeden skok na apeks ------------------------------------------
# Osobny blok zamiast `if ($host != ...)`: dzieki temu www ma wlasny certyfikat
# i przekierowanie wykonuje sie przed jakimkolwiek try_files.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mediaso.pl;

    ssl_certificate     /etc/letsencrypt/live/mediaso.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediaso.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://mediaso.pl$request_uri;
}

# --- HTTPS apeks: serwis wlasciwy --------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name mediaso.pl;

    ssl_certificate     /etc/letsencrypt/live/mediaso.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mediaso.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Symlink przestawiany przez deploy.sh na najnowsze wydanie.
    root /var/www/mediaso/current;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    # HSTS: dwa lata, subdomeny wlacznie. Dopisz do listy preload dopiero,
    # gdy www i apeks stoja stabilnie na HTTPS - wypisanie sie trwa miesiacami.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # style-src 'unsafe-inline' jest wymagane przez Angulara - style komponentow
    # trafiaja do <style> w head. Fonty hostujemy u siebie, wiec zadna domena
    # zewnetrzna nie musi byc na liscie.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Starsze mime.types nie znaja .webmanifest i oddaja go jako octet-stream,
    # przez co Chrome pomija manifest przy instalacji PWA.
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # /404.html serwujemy wylacznie przez error_page, zeby zachowac status 404.
    # Podanie go jako ostatniego argumentu try_files zwracaloby 200 i Google
    # traktowalby kazdy nieistniejacy adres jako miekki blad 404.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Pliki ukryte (.htaccess z buildu, ewentualne .git) nie moga byc widoczne.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Biblioteka SMTP nie jest endpointem - tylko include'em dla contact.php.
    location ^~ /api/lib/ {
        deny all;
    }

    # Formularz kontaktowy. Wykonuje sie wylacznie to, co lezy w /api.
    location ~ ^/api/[a-z0-9_-]+\.php$ {
        include snippets/fastcgi-php.conf;
        # Sprawdz wersje: ls /run/php/
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
    }

    # Poza /api zaden .php nie ma prawa sie wykonac.
    location ~ \.php$ {
        return 404;
    }

    # Jeden adres na strone: /kontakt/ przekierowuje na /kontakt (zgodnie z canonical).
    rewrite ^/(.+)/$ /$1 permanent;

    # Zasoby z hashem w nazwie moga lezec w cache na stale.
    # Naglowki bezpieczenstwa powtarzamy, bo add_header w location kasuje te z server.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # HTML musi byc swiezy, zeby wdrozenie bylo widoczne od razu.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Prerenderowane strony leza jako katalogi z index.html - podaj je bez przekierowania.
    # Ostatni argument to =404, nie plik: inaczej nginx odda strone bledu ze statusem 200.
    location / {
        try_files $uri $uri/index.html =404;
    }
}
