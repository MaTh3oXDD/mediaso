# mediaso.pl - nginx
#
# Wersja startowa: sam HTTP. Bloki HTTPS dopisze certbot komenda
#   sudo certbot --nginx -d mediaso.pl -d www.mediaso.pl
# Certbot doda listen 443, sciezki do certyfikatow i przekierowanie z portu 80.

server {
    listen 80;
    listen [::]:80;
    server_name mediaso.pl www.mediaso.pl;

    # Symlink przestawiany przez deploy.sh na najnowsze wydanie.
    root /var/www/mediaso/current;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # /404.html serwujemy wylacznie przez error_page, zeby zachowac status 404.
    # Podanie go jako ostatniego argumentu try_files zwracaloby 200 i Google
    # traktowalby kazdy nieistniejacy adres jako miekki blad 404.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Jeden kanoniczny adres: www i wejscie po IP ida na mediaso.pl.
    # Certbot dopisze osobno przekierowanie http -> https.
    if ($host != "mediaso.pl") {
        return 301 https://mediaso.pl$request_uri;
    }

    # Pliki ukryte (.htaccess z buildu, ewentualne .git) nie moga byc widoczne.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Biblioteka SMTP nie jest endpointem - tylko include'em dla contact.php.
    location ^~ /api/lib/ {
        deny all;
    }

    # Formularz kontaktowy. Wykonuje sie wylacznie to, co lezy w /api.
    location ~ ^/api/[a-z0-9_-]+\.php$ {
        include snippets/fastcgi-php.conf;
        # Sprawdz wersje: ls /run/php/
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 30s;
    }

    # Poza /api zaden .php nie ma prawa sie wykonac.
    location ~ \.php$ {
        return 404;
    }

    # Jeden adres na strone: /kontakt/ przekierowuje na /kontakt (zgodnie z canonical).
    rewrite ^/(.+)/$ /$1 permanent;

    # Zasoby z hashem w nazwie moga lezec w cache na stale.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML musi byc swiezy, zeby wdrozenie bylo widoczne od razu.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Prerenderowane strony leza jako katalogi z index.html - podaj je bez przekierowania.
    # Ostatni argument to =404, nie plik: inaczej nginx odda strone bledu ze statusem 200.
    location / {
        try_files $uri $uri/index.html =404;
    }
}
